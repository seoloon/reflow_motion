[package]
name = "reflow-desktop"
description = "ReFlow Motion desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reflow-project = { path = "../../../crates/project" }
reflow-renderer = { path = "../../../crates/renderer" }
reflow-git = { path = "../../../crates/git" }
portable-pty = "0.9.0"

[dev-dependencies]
tempfile = "3"

[lib]
name = "reflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
